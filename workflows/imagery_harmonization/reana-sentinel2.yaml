version: 0.9.0
inputs:
  files:
    - sentinel2-workflow.cwl
    - steps/process-sentinel2.cwl
    - scripts/process_sentinel2.py
    - scripts/raster_contracts.py
    - examples/sentinel2-inputs.yml
    - examples/sentinel2_rgb_demo.tif
workflow:
  type: cwl
  file: sentinel2-workflow.cwl
  parameters:
    input: examples/sentinel2-inputs.yml
outputs:
  files:
    - sentinel2_harmonized.tif
    - reference_histogram.json
    - target_grid.json
    - sentinel2_quality.json
    - sentinel2_stac_item.json
    - sentinel2_provenance.json