version: 0.9.0
inputs:
  files:
    - dji-workflow.cwl
    - steps/process-dji.cwl
    - steps/assess-comparability.cwl
    - scripts/process_dji.py
    - scripts/assess_comparability.py
    - scripts/raster_contracts.py
    - examples/dji-inputs.yml
    - examples/dji_orthomosaic_demo.tif
workflow:
  type: cwl
  file: dji-workflow.cwl
  parameters:
    input: examples/dji-inputs.yml
outputs:
  files:
    - dji_harmonized.tif
    - dji_histograms.json
    - dji_quality.json
    - dji_stac_item.json
    - dji_provenance.json
    - comparability_report.json